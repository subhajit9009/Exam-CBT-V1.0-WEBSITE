<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ExamVerse | CBT Examination</title>

<link rel="stylesheet" href="assets/css/exam.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<link rel="stylesheet"
href="assets/css/loader.css">

</head>

<body class="exam-loading">

    <!-- ==========================================
     EXAM ACCESS LOCK
     Prevent interaction before attempt validation
========================================== -->

<div id="examAccessLock">
    <div class="exam-access-message">
        Checking examination status...
    </div>
</div>

   <!-- Loader -->

<div id="loader">

    <img
        src="assets/images/logo.png"
        class="loader-logo">

    <div class="spinner"></div>

    <div class="loading-text">

        Loading...

    </div>

</div>

<div class="exam-container">

<!-- ================= HEADER ================= -->

<header class="exam-header">

<div>

<h2 id="examTitle">Loading Exam...</h2>

<p id="candidateName">Candidate</p>

</div>

<div class="timer-box">

<i class="fa-solid fa-clock"></i>

<span id="timer">00:00:00</span>

</div>

</header>


<!-- ==========================================
     MOBILE PAUSE BUTTON
     ========================================== -->

<div class="mobile-pause-area">

    <button
        id="mobilePauseBtn"
        type="button"
        onclick="window.pauseExam()"
    >

        <i class="fa-solid fa-pause"></i>
        Pause Exam

    </button>

</div>


<!-- ================= MAIN ================= -->

<div class="exam-body">

<!-- LEFT -->

<div class="question-area">

<div class="question-number">

Question

<span id="currentQuestion">

1

</span>

of

<span id="totalQuestion">

0

</span>

</div>

<div class="question-box">

<p id="questionText">

Loading Question...

</p>

</div>

<div class="options">

<label>

<input type="radio"
name="option"
value="A">

<span id="optionA"></span>

</label>

<label>

<input type="radio"
name="option"
value="B">

<span id="optionB"></span>

</label>

<label>

<input type="radio"
name="option"
value="C">

<span id="optionC"></span>

</label>

<label>

<input type="radio"
name="option"
value="D">

<span id="optionD"></span>

</label>

</div>

<div class="navigation">

<button id="previousBtn">

Previous

</button>

<button id="clearBtn">

Clear Response

</button>

<button id="reviewBtn">

Mark Review

</button>

<button id="nextBtn">

Save & Next

</button>

</div>

</div>

<!-- RIGHT -->

<div class="palette">

    <button
        id="mobilePaletteClose"
        type="button"
    >
        ✕ Close
    </button>

    <h3>Question Palette</h3>

    <div id="questionPalette"></div>

    <div class="exam-action-buttons">

    <button
        id="pauseBtn"
        type="button"
        class="pause-exam-btn"
    >
        <i class="fa-solid fa-pause"></i>
        Pause Exam
    </button>

    <button
        id="submitBtn"
        type="button"
    >
        Submit Exam
    </button>

</div>

</div>

<button
    id="mobilePaletteToggle"
    type="button"
>
    ☰ Question Palette
</button>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script src="assets/js/supabase.js"></script>
<script src="assets/js/storage.js"></script>
<script src="assets/js/exam.js"></script>

<script>
/* ==========================================
   ExamVerse Mobile Device Detection
   Works even when Chrome Desktop Site is ON
========================================== */

(function () {

    const isTouchDevice =
        navigator.maxTouchPoints > 0 ||
        'ontouchstart' in window;

    if (isTouchDevice) {
        document.documentElement.classList.add("touch-device");
        document.body.classList.add("touch-device");

        console.log("📱 Touch/mobile device detected");
    } else {
        console.log("🖥️ Desktop device detected");
    }

})();
</script>

<script src="assets/js/loader.js"></script>

</body>

</html>
