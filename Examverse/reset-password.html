<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | ExamVerse</title>

    <link rel="icon" type="image/png" href="assets/images/favicon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="assets/css/loader.css">
    <link rel="stylesheet" href="assets/css/popup.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #312e81);
            position: relative;
            overflow: hidden;
        }

        /* Ambient background blur elements */
        body::before,
        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
        }

        body::before {
            background: rgba(37, 99, 235, 0.4);
            top: 10%;
            left: 15%;
        }

        body::after {
            background: rgba(124, 58, 237, 0.4);
            bottom: 10%;
            right: 15%;
        }

        .container {
            width: 100%;
            max-width: 460px;
            position: relative;
            z-index: 1;
        }

        /* Glassmorphism Card */
        .card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 24px;
            padding: 45px 35px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        /* Brand Branding Section */
        .brand-header {
            margin-bottom: 25px;
        }

        .brand-name {
            font-size: 28px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .brand-tagline {
            font-size: 13px;
            font-weight: 500;
            color: #60a5fa;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 4px;
        }

        .divider {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            margin: 20px 0 25px;
        }

        h2 {
            font-size: 22px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        /* Form Controls */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 16px;
            transition: color 0.3s ease;
        }

        input {
            width: 100%;
            padding: 14px 16px 14px 48px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            font-size: 14px;
            color: #ffffff;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #64748b;
        }

        input:focus {
            background: rgba(255, 255, 255, 0.1);
            border-color: #3b82f6;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        input:focus + i {
            color: #3b82f6;
        }

        /* Action Button */
        button[type="submit"] {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #2563eb, #6366f1);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.35);
            transition: all 0.3s ease;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.5);
            background: linear-gradient(135deg, #1d4ed8, #4f46e5);
        }

        @media (max-width: 480px) {
            .card {
                padding: 35px 22px;
            }

            .brand-name {
                font-size: 24px;
            }

            h2 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div id="loader">
        <img src="assets/images/logo.png" class="loader-logo" alt="ExamVerse Logo">
        <div class="spinner"></div>
        <div class="loading-text">Loading...</div>
    </div>

    <div class="container">
        <div class="card">

            <div class="brand-header">
                <div class="brand-name">ExamVerse</div>
                <div class="brand-tagline">A CBT Platform</div>
            </div>

            <div class="divider"></div>

            <h2>Create New Password</h2>
            <p>Please enter your new password below.</p>

            <form id="resetForm">
                <div class="input-group">
                    <input type="password" id="password" placeholder="New Password" required>
                    <i class="fa-solid fa-lock"></i>
                </div>

                <div class="input-group">
                    <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                    <i class="fa-solid fa-shield-halved"></i>
                </div>

                <button type="submit">Update Password</button>
            </form>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/popup.js"></script>
    <script src="assets/js/reset-password.js"></script>
    <script src="assets/js/loader.js"></script>

</body>

</html>
